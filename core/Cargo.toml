[workspace]
resolver = "3"
members = ["isled", "isle-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"

[workspace.dependencies]
isle-core = { path = "isle-core" }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.37"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }