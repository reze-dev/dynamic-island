# Dynamic Island keybinds for Sway.
#
# Include from your Sway config (e.g. `include /path/to/this/file` or copy
# the lines into ~/.config/sway/config). The compositor never learns the
# island's protocol: it only ever runs `isled call`.
#
# Mod is set to Mod4 in ~/.config/sway/config. Mod+1..9 is workspace
# switching in Sway, so the island uses Mod+Ctrl+1..9, mirroring
# nix/keybinds.nix for niri/hyprland.

# The panels, in the order the island walks them.
bindsym $mod+Ctrl+1 exec isled call view.set 0
bindsym $mod+Ctrl+2 exec isled call view.set 1
bindsym $mod+Ctrl+3 exec isled call view.set 2
bindsym $mod+Ctrl+4 exec isled call view.set 3
bindsym $mod+Ctrl+5 exec isled call view.set 4
bindsym $mod+Ctrl+6 exec isled call view.set 5
bindsym $mod+Ctrl+7 exec isled call view.set 6
bindsym $mod+Ctrl+8 exec isled call view.set 7
bindsym $mod+Ctrl+9 exec isled call view.set 8

# Toggle (open/close) and focus.
bindsym $mod+Ctrl+J exec isled call island.toggle
bindsym $mod+Ctrl+K exec isled call island.focus

# The tray, after the nine.
bindsym $mod+Ctrl+T exec isled call view.set 9
