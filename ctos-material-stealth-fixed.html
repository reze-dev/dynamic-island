<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ctOS · Material Stealth</title>
<style>
:root{color-scheme:dark;--bg:#000;--surface:#111;--accent:#d2e3ff;--accent-dim:rgba(210,227,255,.1);--text:#e3e3e3;--muted:#9aa0a6;--glass:rgba(20,20,20,.88)}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-image:radial-gradient(circle at 20% 20%,rgba(210,227,255,.05),transparent 50%),radial-gradient(circle at 80% 80%,rgba(161,136,204,.05),transparent 50%)}
.sysbar{position:absolute;inset:0 0 auto;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;color:var(--muted);z-index:2}.brand{display:flex;align-items:center;gap:8px}.dot{color:var(--accent)}
#island{position:absolute;z-index:5;top:14px;left:50%;transform:translateX(-50%);width:140px;height:34px;border-radius:100px;background:#000;overflow:hidden;box-shadow:0 20px 50px #000c;cursor:pointer;transition:width .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1),border-radius .25s,background .25s;border:1px solid transparent}
#island.active{width:300px;height:42px}#island.expanded{width:min(440px,calc(100vw - 28px));height:min(var(--panel-height,240px),calc(100vh - 110px));border-radius:28px;background:var(--glass);backdrop-filter:blur(28px);border-color:#ffffff1a;cursor:default}
#islandInner{height:100%;width:100%;position:relative}.idleview,.activeview{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.12em}.activeview{justify-content:space-between;padding:0 16px;color:var(--text);font-size:13px;letter-spacing:0}.activeleft{display:flex;align-items:center;gap:10px}.glyph{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;background:var(--accent);color:#111;font-size:13px;font-weight:700}.pulse{display:flex;gap:3px;align-items:flex-end;height:14px}.pulse i{display:block;width:3px;height:6px;border-radius:2px;background:var(--accent);animation:pulse .8s infinite alternate}.pulse i:nth-child(2){animation-delay:.15s}.pulse i:nth-child(3){animation-delay:.3s}.pulse i:nth-child(4){animation-delay:.45s}@keyframes pulse{to{height:13px}}
.expandedview{height:100%;padding:22px;display:flex;flex-direction:column;min-height:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.paneltitle{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650}.paneltitle .symbol{color:var(--accent)}.nav{display:flex;gap:5px}.nav button{border:0;border-radius:50%;width:29px;height:29px;background:#ffffff12;color:var(--text);cursor:pointer;font-size:14px}.nav button.selected{background:var(--accent);color:#111}.panelbody{overflow:auto;flex:1;min-height:0;scrollbar-width:none}.panelbody::-webkit-scrollbar{display:none}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#ffffff0d;border:1px solid transparent;border-radius:16px;padding:14px;display:flex;align-items:center;gap:11px;cursor:pointer;text-align:left;color:var(--text);font:inherit;min-width:0}.tile.on{background:var(--accent-dim);border-color:#d2e3ff70}.tile .symbol{font-size:20px;color:var(--muted)}.tile.on .symbol{color:var(--accent)}.tile small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.track{height:4px;border-radius:9px;background:#ffffff1a;overflow:hidden}.track span{display:block;height:100%;width:40%;background:var(--accent)}.controls{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:16px}.control{border:0;background:transparent;color:var(--text);font-size:25px;cursor:pointer}.control.main{font-size:40px;color:var(--accent)}.rowcard{background:#ffffff0d;padding:12px;border-radius:13px;display:flex;gap:12px;align-items:center;margin-bottom:9px}.cover{width:58px;height:58px;border-radius:12px;background:linear-gradient(135deg,#4285f4,#ea4335);flex:none}.muted{color:var(--muted)}.small{font-size:12px}.clip{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;background:#ffffff0d;border:0;color:var(--text);border-radius:12px;padding:12px;text-align:left;font:12px ui-monospace,monospace;cursor:pointer;margin-bottom:8px;overflow-wrap:anywhere}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}.day{padding:6px 0;border-radius:50%}.day.today{background:var(--accent);color:#111;font-weight:700}.event{margin-top:14px;background:#ffffff0d;border-radius:12px;padding:12px;font-size:12px}.event strong{display:block;color:var(--accent);margin-bottom:4px}textarea{width:100%;height:100%;min-height:150px;background:#ffffff08;border:1px solid #ffffff1a;border-radius:14px;color:var(--text);padding:14px;outline:none;resize:none;font:13px/1.5 inherit}textarea:focus{border-color:#d2e3ff70}.notice{background:#ffffff0d;border-radius:14px;padding:12px;display:flex;gap:11px;margin-bottom:9px}.notice .symbol{color:var(--accent)}.hints{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);opacity:.55;text-align:center;white-space:nowrap}kbd{background:#222;padding:3px 6px;border-radius:4px;color:#fff;font:11px monospace;border:1px solid #333}.toast{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border:1px solid #ffffff20;border-radius:10px;padding:8px 12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:480px){.sysbar{padding:12px 14px}.expandedview{padding:17px}.panelhead{align-items:flex-start;flex-direction:column}.nav{width:100%;justify-content:space-between}.hints{font-size:10px}.tile{padding:11px;gap:8px}}
</style>
</head>
<body>
<header class="sysbar"><div class="brand"><span class="dot">●</span> ctOS // CORE</div><div id="clock">--:--</div></header>
<div id="island" role="button" tabindex="0" aria-label="ctOS island"><div id="islandInner"></div></div>
<div class="hints"><kbd>Ctrl+J</kbd> Toggle Shell &nbsp; | &nbsp; <kbd>1–6</kbd> Modules &nbsp; | &nbsp; <kbd>Esc</kbd> Idle</div><div id="toast" class="toast" role="status"></div>
<script>
(() => {
  const modules = {
    NETWORK:{id:'network',label:'Network',icon:'◉',height:240},
    MEDIA:{id:'media',label:'Media',icon:'♫',height:280},
    CLIPBOARD:{id:'clipboard',label:'Clipboard',icon:'▤',height:350},
    CALENDAR:{id:'calendar',label:'Calendar',icon:'▦',height:320},
    NOTES:{id:'notes',label:'Notes',icon:'✎',height:400},
    NOTIF:{id:'notif',label:'Notifications',icon:'♧',height:350}
  };
  const island=document.querySelector('#island'), inner=document.querySelector('#islandInner'), clock=document.querySelector('#clock'), toast=document.querySelector('#toast');
  let status='idle', context='NETWORK', playing=false, toastTimer, notesValue='';
  try { notesValue=localStorage.getItem('ctos-notes')||''; } catch {}
  const keys=Object.keys(modules);
  function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)}
  function icon(text, extra=''){return `<span class="symbol ${extra}">${text}</span>`}
  function panelBody(){
    if(context==='NETWORK') return `<div class="tiles">${[
      ['Wi-Fi','◉',navigator.onLine,'Browser reports network status'],['Bluetooth','ᛒ',false,'Hardware status unavailable in browser'],['Airplane','✈',false,'Demo control'],['VPN','⬡',false,'Demo control'],['Hotspot','⌁',false,'Demo control'],['NFC','⌗',false,'Demo control']
    ].map(([label,ico,on,sub])=>`<button class="tile ${on?'on':''}" data-toggle="${label}">${icon(ico)}<span>${label}<small>${label==='Wi-Fi'?(navigator.onLine?'Online':'Offline'):sub}</small></span></button>`).join('')}</div>`;
    if(context==='MEDIA') return `<div class="rowcard"><div class="cover"></div><div style="flex:1;min-width:0"><div style="font-weight:650">Glasshouse</div><div class="muted small">Aether Systems · Demo track</div></div></div><div class="track"><span></span></div><div class="controls"><button class="control" data-action="previous" aria-label="Previous">|◀</button><button class="control main" data-action="play" aria-label="Play or pause">${playing?'Ⅱ':'▶'}</button><button class="control" data-action="next" aria-label="Next">▶|</button></div><p class="muted small" style="text-align:center">Playback controls are illustrative in this prototype.</p>`;
    if(context==='CLIPBOARD') return `<div>${['nix develop .#shell','https://quickshell.org','systemctl restart ctos'].map(t=>`<button class="clip" data-copy="${escapeAttr(t)}"><span>${escapeHtml(t)}</span><span>⧉</span></button>`).join('')}<p class="muted small">Select an item to copy it to your clipboard.</p></div>`;
    if(context==='CALENDAR') {const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();return `<div class="muted small" style="margin-bottom:10px">${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="calendar">${['S','M','T','W','T','F','S'].map(d=>`<div class="muted">${d}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:count},(_,i)=>`<div class="day ${i+1===now.getDate()?'today':''}">${i+1}</div>`).join('')}</div><div class="event"><strong>14:00 · Platform Sync</strong><span class="muted">Demo event · Review ctOS geometry logic</span></div>`; }
    if(context==='NOTES') return `<textarea id="notes" placeholder="Quick note...">${escapeHtml(notesValue)}</textarea><div class="muted small" style="margin-top:7px">Autosaves in this browser when storage is available.</div>`;
    return `<div class="notice">${icon('↻')}<div><strong class="small">System Update</strong><div class="muted small">Kernel update notification · Demo</div></div></div><div class="notice">${icon('◉')}<div><strong class="small">Network</strong><div class="muted small">${navigator.onLine?'Browser reports online':'Browser reports offline'}</div></div></div>`;
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function escapeAttr(s){return escapeHtml(s);}
  function render(){
    island.className=status==='idle'?'':status;
    island.style.setProperty('--panel-height',modules[context].height+'px');
    if(status==='idle'){inner.innerHTML='<div class="idleview">ctOS</div>';island.setAttribute('aria-label','Open ctOS island');return;}
    if(status==='active'){inner.innerHTML=`<div class="activeview"><div class="activeleft"><span class="glyph">${modules[context].icon}</span><span>${modules[context].label} Active</span></div><div class="pulse"><i></i><i></i><i></i><i></i></div></div>`;island.setAttribute('aria-label','Expand ctOS island');return;}
    inner.innerHTML=`<div class="expandedview"><div class="panelhead"><div class="paneltitle">${icon(modules[context].icon)}<span>${modules[context].label}</span></div><nav class="nav" aria-label="Modules">${keys.map((key,i)=>`<button title="${modules[key].label} (${i+1})" aria-label="${modules[key].label}" data-module="${key}" class="${context===key?'selected':''}">${modules[key].icon}</button>`).join('')}</nav></div><div class="panelbody">${panelBody()}</div></div>`;
    island.setAttribute('aria-label',modules[context].label+' panel');
    const note=document.querySelector('#notes'); if(note) note.addEventListener('input',()=>{notesValue=note.value;try{localStorage.setItem('ctos-notes',notesValue)}catch{}});
  }
  function setStatus(next){status=next;render()}
  island.addEventListener('click',()=>{if(status==='idle')setStatus('active');else if(status==='active')setStatus('expanded')});
  island.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(status==='idle')setStatus('active');else if(status==='active')setStatus('expanded')}});
  inner.addEventListener('click',async e=>{
    const nav=e.target.closest('[data-module]');if(nav){context=nav.dataset.module;render();return;}
    const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);notify('Copied to clipboard')}catch{notify('Clipboard access blocked by browser; select and copy manually')}return;}
    const toggle=e.target.closest('[data-toggle]');if(toggle){notify(`${toggle.dataset.toggle}: demo control only`);return;}
    const action=e.target.closest('[data-action]');if(action){if(action.dataset.action==='play'){playing=!playing;render()}else notify('Demo playback control');}
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();setStatus(status==='expanded'?'idle':'expanded');return;}
    if(e.key==='Escape'){setStatus('idle');return;}
    if(/^[1-6]$/.test(e.key)&&!e.altKey&&!e.ctrlKey&&!e.metaKey){context=keys[Number(e.key)-1];setStatus('expanded');}
  });
  function tick(){clock.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
  window.addEventListener('online',()=>{if(status==='expanded'&&context==='NETWORK')render()});window.addEventListener('offline',()=>{if(status==='expanded'&&context==='NETWORK')render()});tick();setInterval(tick,1000);render();
})();
</script>
</body>
</html>
