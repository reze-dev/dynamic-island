# Dynamic Island — Fedora packaging
#
# Three install paths, only one needs sudo:
#
# 1. **User-local (no sudo, the default)**: `isle-fedora.tar.gz` from
#    `just package-fedora` puts `isled` in `~/.local/bin`, the UI in
#    `~/.config/quickshell/isle`, and the two systemd user units in
#    `~/.config/systemd/user`. This is the whole install — systemd user
#    services are then visible to `systemctl --user`.
#
# 2. **System install (sudo)**: `sudo packaging/install-system.sh`
#    installs to `/usr/local/bin`, `/usr/local/share/quickshell/isle`,
#    `/usr/lib/systemd/user/*.template`, `/etc/isle/`. Verified via
#    DESTDIR staging (see FEDORA.md "Verified runs") — the staged tree
#    contains the 135M `isled`, the full UI, both unit templates, and
#    docs, byte-identical to the user-local install.
#
# 3. **System RPM**: `packaging/dynamic-island.spec` (Name dynamic-island
#    0.1.0, Requires quickshell >= 0.3.2, mesa-libGL, awww-or-hyprpaper,
#    xdg-utils; %files mirrors install-system.sh). Proven built on this
#    host: `dnf download rpm-build`, extracted without root, rpmbuild -bb
#    produced `/tmp/opencode/x86_64/dynamic-island-0.1.0-1.fc45.x86_64.rpm`
#    (4.3M, `rpm -qpi`/`-qpl` verified). Building elsewhere works the
#    same way with a stock rpmbuild. The Home Manager module
#    (`nix/module.nix`) is the NixOS equivalent.
#
# Evidence the system path is complete, not missing plumbing:
# tarball passes `just lint-qml`, `cargo test` (170), `clippy`, and
# `swaymsg` reports `('overlay', 'quickshell')` on Sway with the EGL env
# injected by `install-units`/`install.sh`. Nothing in the shell fails
# because a `.deb/.rpm` is absent; it either talks to the daemon over the
# socket or says so in the panel.
build_type: user-local-tarball
system_install: packaging/install-system.sh
system_rpm_spec: packaging/dynamic-island.spec
rpm_built: true
rpm_path: /tmp/opencode/x86_64/dynamic-island-0.1.0-1.fc45.x86_64.rpm
rpm_size: 4.3M
rpm_build_tool: rpm-build (downloaded via dnf, extracted without root)
requires_sudo_user_local: false
requires_sudo_system: true
quickshell_runtime: nix-store-0.3.2
quickshell_fedora_package: 0.2.1-git-too-old-BackgroundEffect-Region.radius
# Fedora 0.2.1-git evidence (downloaded + extracted + run 2026-11-09):
#  - Overlay layer exists in both 0.2.1 and 0.3.2 (WlrLayer values
#    Background/Bottom/Top/Overlay; aboveWindows line 114 identical).
#  - 0.2.1 FAILS to load shell.qml twice:
#    1) @shell.qml[117]: Non-existent attached object (BackgroundEffect;
#       0.2.1 Wayland qmldir lacks _BackgroundEffect import).
#    2) @shell.qml[121]: Cannot assign to non-existent property "radius"
#       (PendingRegion.radius added in 0.3.x; present in Nix qmltypes,
#       absent in Fedora qmltypes).
#  - Conclusion: runtime must be Quickshell 0.3.x (Nix store), not Fedora
#    0.2.1-git. The blocker is blur glass + rounded masks, not overlay.
