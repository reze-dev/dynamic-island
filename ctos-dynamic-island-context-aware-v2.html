<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>ctOS · Dynamic Island Concept</title>
  <meta name="description" content="A desktop-first, interactive Dynamic Island concept for ctOS, inspired by Apple's compact and expanded Live Activity patterns." />
  <style>
    :root {
      --base: #191724;
      --surface: #1f1d2e;
      --overlay: #26233a;
      --muted: #6e6a86;
      --subtle: #908caa;
      --text: #e0def4;
      --love: #eb6f92;
      --gold: #f6c177;
      --rose: #ebbcba;
      --pine: #31748f;
      --foam: #9ccfd8;
      --iris: #c4a7e7;
      --leaf: #a3be8c;
      --border: rgba(224, 222, 244, .10);
      --shadow: 0 28px 100px rgba(0,0,0,.42), 0 4px 22px rgba(0,0,0,.22);
      --island-width: 300px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: var(--base);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--iris); outline-offset: 3px; }
    .desktop {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 18% 78%, rgba(49,116,143,.20), transparent 38%),
        radial-gradient(ellipse at 80% 18%, rgba(196,167,231,.14), transparent 34%),
        radial-gradient(ellipse at 54% 105%, rgba(235,111,146,.10), transparent 38%),
        linear-gradient(135deg, #191724 0%, #1f1d2e 52%, #191724 100%);
    }
    .desktop::before, .desktop::after {
      content: ""; position: absolute; pointer-events: none; z-index: -1;
      border: 1px solid rgba(224,222,244,.045); border-radius: 50%;
      width: 66vw; height: 66vw; min-width: 700px; min-height: 700px;
      left: -21vw; bottom: -43vw; transform: rotate(-24deg);
    }
    .desktop::after {
      width: 48vw; height: 48vw; min-width: 530px; min-height: 530px;
      left: auto; right: -16vw; bottom: -30vw; border-color: rgba(156,207,216,.07);
    }
    .grain {
      position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
    }
    .top-meta {
      position: absolute; top: 26px; left: 34px; right: 34px;
      display: flex; align-items: center; justify-content: space-between;
      color: var(--subtle); font-size: 12px; letter-spacing: .02em;
    }
    .brand { display:flex; align-items:center; gap:10px; color:var(--text); font-weight:650; letter-spacing:.08em; }
    .brand-mark { width:9px; height:9px; border-radius:50%; background:var(--iris); box-shadow:0 0 18px rgba(196,167,231,.6); }
    .system-meta { display:flex; gap:17px; align-items:center; }
    .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--leaf); margin-right:7px; }
    .center-note {
      position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%);
      width: min(620px, 90vw); text-align: center; pointer-events: none; opacity: .75;
    }
    .eyebrow { color:var(--iris); font-size:11px; text-transform:uppercase; letter-spacing:.24em; font-weight:700; }
    .center-note h1 { margin: 18px 0 12px; font-size: clamp(36px, 5.5vw, 66px); letter-spacing:-.065em; line-height:.98; font-weight:650; }
    .center-note p { color:var(--subtle); margin:0 auto; max-width:410px; font-size:14px; line-height:1.7; }
    .hint {
      position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
      color:rgba(224,222,244,.45); font-size:11px; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
    }
    .island-anchor {
      position:absolute; z-index:10; top:16px; left:50%; transform:translateX(-50%);
      display:flex; align-items:flex-start; justify-content:center; width:min(94vw, 720px);
      pointer-events:none;
    }
    .island {
      pointer-events:auto; position:relative; width:var(--island-width); min-height:60px;
      border-radius:32px; background:#050507; color:#f7f5ff;
      border:1px solid rgba(255,255,255,.09);
      box-shadow: 0 8px 28px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.07);
      transition: width .42s cubic-bezier(.2,.85,.2,1), border-radius .35s ease, min-height .35s ease, transform .35s ease;
      overflow:hidden; transform-origin:top center;
    }
    .island.expanded { width:min(510px, calc(100vw - 28px)); min-height:190px; border-radius:27px; }
    .island[data-view="notes"].expanded, .island[data-view="calendar"].expanded { min-height:300px; }
    .island[data-view="clipboard"].expanded { min-height:250px; }
    .island[data-view="notifications"].expanded { min-height:270px; }
    .island.compact:hover { border-color:rgba(196,167,231,.30); }
    .island-top {
      min-height:58px; display:flex; align-items:center; gap:10px; padding:9px 14px;
      cursor:pointer; user-select:none;
    }
    .island.expanded .island-top { cursor:default; border-bottom:1px solid rgba(255,255,255,.07); }
    .cover {
      width:38px; height:38px; flex:0 0 38px; border-radius:12px; overflow:hidden;
      display:grid; place-items:center; color:#191724;
      background:linear-gradient(135deg,#ebbcba,#c4a7e7 52%,#31748f);
    }
    .cover svg { width:20px; height:20px; }
    .mini-bars { display:flex; align-items:center; justify-content:center; gap:3px; height:25px; width:24px; }
    .mini-bars i { display:block; width:3px; border-radius:4px; background:var(--iris); animation:wave 1.1s ease-in-out infinite alternate; }
    .mini-bars i:nth-child(1){height:8px;animation-delay:-.4s}.mini-bars i:nth-child(2){height:17px;animation-delay:-.1s}.mini-bars i:nth-child(3){height:12px;animation-delay:-.7s}.mini-bars i:nth-child(4){height:21px;animation-delay:-.2s}
    .paused .mini-bars i { animation-play-state:paused; height:5px !important; }
    @keyframes wave { from { transform:scaleY(.48); opacity:.65 } to { transform:scaleY(1); opacity:1 } }
    .track { flex:1; min-width:0; }
    .track-title { font-size:12px; font-weight:650; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .track-sub { color:#8f8c9e; font-size:10px; margin-top:4px; }
    .island-actions { display:flex; align-items:center; gap:7px; }
    .icon-button {
      display:grid; place-items:center; width:31px; height:31px; border:0; border-radius:50%;
      background:transparent; color:#c7c4d4; cursor:pointer; transition:background .18s,color .18s;
    }
    .icon-button:hover { background:rgba(255,255,255,.09); color:white; }
    .icon-button svg { width:16px; height:16px; }

    .module-actions { gap:3px; }
    .module-button {
      display:grid; place-items:center; width:29px; height:29px; border:0; border-radius:50%;
      background:transparent; color:#777387; cursor:pointer; transition:background .18s,color .18s;
    }
    .module-button:hover { background:rgba(255,255,255,.06); color:#c8c4d8; }
    .module-button.selected { color:#c4a7e7; background:rgba(196,167,231,.13); }
    .module-button svg { width:14px; height:14px; }

    .compact-right { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .compact-time { color:#8e8a9f; font-size:10px; font-variant-numeric:tabular-nums; }
    .island-body { padding:15px 17px 17px; animation:appear .22s ease both; }
    @keyframes appear { from { opacity:0; transform:translateY(-4px) } to { opacity:1; transform:translateY(0) } }
    .panel-heading { display:flex; justify-content:space-between; align-items:center; margin:0 0 13px; }
    .panel-heading h2 { margin:0; font-size:13px; font-weight:650; letter-spacing:-.02em; }
    .muted { color:#8f8b9f; font-size:11px; }
    .media-layout { display:grid; grid-template-columns:100px 1fr; gap:17px; align-items:center; }
    .album-art {
      width:100px; height:100px; border-radius:17px; display:grid; place-items:center; position:relative; overflow:hidden;
      background:linear-gradient(145deg,#f6c177,#eb6f92 42%,#c4a7e7 78%,#31748f);
      box-shadow:0 9px 28px rgba(196,167,231,.13);
    }
    .album-art::before { content:""; position:absolute; width:75px;height:75px;border:1px solid rgba(255,255,255,.42);border-radius:50%; }
    .album-art::after { content:""; position:absolute; width:46px;height:46px;border:1px solid rgba(255,255,255,.38);border-radius:50%; }
    .album-art svg { width:26px;height:26px;z-index:1; filter:drop-shadow(0 2px 5px rgba(0,0,0,.2)); }
    .media-info h3 { font-size:15px; margin:0 0 5px; letter-spacing:-.03em; }
    .media-info p { font-size:11px; color:#9691a7; margin:0; }
    .progress { height:3px; background:rgba(255,255,255,.13); border-radius:4px; margin:16px 0 7px; overflow:hidden; }
    .progress-fill { height:100%; background:#f5f1ff; border-radius:4px; transition:width .3s; }
    .time-row { display:flex; justify-content:space-between; color:#777387; font-size:9px; font-variant-numeric:tabular-nums; }
    .transport { display:flex; align-items:center; justify-content:center; gap:18px; margin-top:12px; }
    .transport .icon-button { width:34px;height:34px; }
    .transport .play { background:#f3f0fb; color:#14121a; width:39px;height:39px; }
    .transport .play:hover { background:white; }
    .transport .play svg { width:17px;height:17px; }
    .quick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .quick-card { border:1px solid var(--border); background:rgba(255,255,255,.035); border-radius:15px; min-height:91px; padding:13px 12px; text-align:left; cursor:pointer; transition:background .18s,border-color .18s,transform .18s; }
    .quick-card:hover { background:rgba(196,167,231,.09); border-color:rgba(196,167,231,.24); transform:translateY(-1px); }
    .quick-card .qicon { width:31px;height:31px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px; }
    .qicon svg { width:16px;height:16px; }
    .quick-card strong { display:block;font-size:11px;font-weight:600; }
    .quick-card small { display:block;color:#8f8b9f;font-size:10px;margin-top:4px; }
    .lavender { background:rgba(196,167,231,.15);color:var(--iris) }.blue { background:rgba(156,207,216,.13);color:var(--foam) }.pink { background:rgba(235,111,146,.13);color:var(--love) }.gold { background:rgba(246,193,119,.13);color:var(--gold) }.green { background:rgba(163,190,140,.13);color:var(--leaf) }
    .list { display:flex; flex-direction:column; gap:7px; }
    .list-item { display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:12px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.045); }
    .list-icon { width:31px;height:31px;flex:0 0 31px;border-radius:10px;display:grid;place-items:center;background:rgba(196,167,231,.12);color:var(--iris); }
    .list-icon svg { width:15px;height:15px; }
    .list-copy { flex:1;min-width:0; }
    .list-copy strong { display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .list-copy small { display:block;font-size:10px;color:#8f8b9f;margin-top:4px; }
    .pill { font-size:9px;color:var(--foam);border:1px solid rgba(156,207,216,.2);background:rgba(156,207,216,.08);border-radius:99px;padding:4px 7px;white-space:nowrap; }
    .small-action { border:1px solid var(--border); border-radius:9px; background:rgba(255,255,255,.045); color:#c9c5d8; font-size:10px; padding:7px 9px; cursor:pointer; }
    .small-action:hover { background:rgba(255,255,255,.09); }
    .clipboard-list { display:flex;flex-direction:column;gap:7px; }
    .clip-item { display:flex;gap:10px;align-items:center;padding:10px 11px;background:rgba(255,255,255,.035);border-radius:11px; }
    .clip-text { flex:1;min-width:0;font-size:11px;color:#c8c4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .clip-type { color:#8f8b9f;font-size:9px; text-transform:uppercase;letter-spacing:.08em; }
    .note-area { width:100%;min-height:120px;resize:vertical;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:13px;padding:12px;color:var(--text);font-size:12px;line-height:1.65; }
    .note-footer { display:flex;justify-content:space-between;align-items:center;margin-top:9px; }
    .calendar-layout { display:grid;grid-template-columns:1fr 1.2fr;gap:15px; }
    .calendar-card { padding:12px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--border); }
    .calendar-month { display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;margin-bottom:12px; }
    .days { display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center; }
    .day { display:grid;place-items:center;aspect-ratio:1;border-radius:8px;color:#a29db3;font-size:9px; }
    .day.head { color:#666278;font-size:8px; }
    .day.selected { background:var(--iris);color:#191724;font-weight:700; }
    .day.has-event:not(.selected)::after { content:"";width:3px;height:3px;background:var(--foam);border-radius:50%;position:absolute;margin-top:15px; }
    .event-list { display:flex;flex-direction:column;gap:9px; }
    .event { display:flex;gap:10px;align-items:flex-start; }
    .event-time { color:var(--foam);font-size:10px;min-width:42px;padding-top:2px;font-variant-numeric:tabular-nums; }
    .event-line { width:2px;align-self:stretch;background:rgba(156,207,216,.35);border-radius:3px; }
    .event strong { display:block;font-size:11px;font-weight:600; }
    .event small { display:block;color:#8f8b9f;font-size:10px;margin-top:4px; }
    .notice { display:flex;gap:11px;padding:12px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:13px;margin-bottom:8px; }
    .notice-mark { width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 34px; }
    .notice-mark svg { width:16px;height:16px; }
    .notice-content { flex:1;min-width:0; }
    .notice-title { display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:650; }
    .notice-title time { color:#777387;font-size:9px;font-weight:400;white-space:nowrap; }
    .notice p { font-size:10px;line-height:1.5;color:#a29db3;margin:5px 0 0; }
    .empty { text-align:center;color:#8f8b9f;font-size:11px;padding:25px 10px; }
    .toast {
      position:fixed;z-index:30;left:50%;bottom:24px;transform:translate(-50%,12px);
      padding:11px 15px;border:1px solid rgba(224,222,244,.12);border-radius:12px;
      background:#26233a;color:#e0def4;font-size:11px;box-shadow:var(--shadow);
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    }
    .toast.show { opacity:1;transform:translate(-50%,0); }
    .help {
      position:absolute;right:32px;bottom:28px;display:flex;gap:7px;align-items:center;color:rgba(224,222,244,.38);font-size:10px;
    }
    kbd { font:inherit;font-size:9px;border:1px solid rgba(224,222,244,.15);border-radius:5px;padding:3px 5px;color:rgba(224,222,244,.55); }
    .context-strip { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:10px; }
    .context-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border-radius:999px; border:1px solid rgba(224,222,244,.10); background:rgba(255,255,255,.035); color:#a29db3; font-size:9px; }
    .context-chip .signal { width:5px; height:5px; border-radius:50%; background:var(--leaf); }
    .context-chip.warn .signal { background:var(--gold); }
    .context-chip.off .signal { background:var(--love); }
    .context-toggle { display:flex; align-items:center; gap:7px; color:#9b96ad; font-size:10px; }
    .context-toggle input { accent-color:var(--iris); }
    .list-icon.green { background:rgba(163,190,140,.13);color:var(--leaf); }
    .list-icon.pink { background:rgba(235,111,146,.13);color:var(--love); }
    .context-detail { margin-top:12px; padding:10px 11px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.025); color:#aaa5ba; font-size:10px; line-height:1.6; }
    .mobile-warning { display:none; }
    @media (max-width:650px) {
      .top-meta { top:18px;left:17px;right:17px; }
      .system-meta { gap:8px; }
      .system-meta .optional { display:none; }
      .island-anchor { top:12px;width:100%; }
      .island.expanded { width:calc(100vw - 20px); }
      .module-actions { gap:1px; }
      .module-button { width:26px; height:28px; }
      .island.expanded .island-top { gap:7px; padding-left:11px; padding-right:10px; }
      .island.expanded .cover { width:32px; height:32px; flex-basis:32px; border-radius:10px; }
      .island.expanded .track-sub { display:none; }
      .center-note { top:52%; }
      .center-note h1 { font-size:42px; }
      .calendar-layout { grid-template-columns:1fr; }
      .calendar-card { display:none; }
      .quick-card { min-height:84px;padding:10px; }
      .hint { bottom:22px;font-size:9px; }
      .help { display:none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="desktop" id="root">
    <div class="grain"></div>
    <header class="top-meta">
      <div class="brand"><span class="brand-mark"></span><span>ctOS</span><span style="color:var(--muted);font-weight:400">/ CONCEPT 01</span></div>
      <div class="system-meta"><span><i class="status-dot"></i>All systems quiet</span><span class="optional">WAYLAND · DESKTOP</span><span id="clock">18:42</span></div>
    </header>
    <section class="center-note" aria-hidden="true">
      <div class="eyebrow">A quieter desktop</div>
      <h1>Useful when<br/>you need it.</h1>
      <p>A small surface for live activity and quick tools. Everything else stays out of the way.</p>
    </section>
    <div class="hint">Click the island to expand · Select a module · Press Esc to collapse</div>
    <div class="help"><kbd>⌘</kbd><kbd>J</kbd><span>toggle island</span><kbd>1</kbd>–<kbd>7</kbd><span>switch views</span></div>
    <div class="island-anchor" id="island-anchor"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@19.1.0";
    import { createRoot } from "https://esm.sh/react-dom@19.1.0/client";

    const h = React.createElement;
    const icons = {
      music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',

      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',

      play: '<path d="m7 4 14 8-14 8z" fill="currentColor" stroke="none"/>',
      pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/>',
      prev: '<path d="M19 20 9 12l10-8z" fill="currentColor" stroke="none"/><path d="M5 19V5"/>',
      next: '<path d="m5 4 10 8-10 8z" fill="currentColor" stroke="none"/><path d="M19 5v14"/>',
      close: '<path d="m18 6-12 12M6 6l12 12"/>',
      chevron: '<path d="m6 9 6 6 6-6"/>',
      arrow: '<path d="M7 17 17 7M7 7h10v10"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',
